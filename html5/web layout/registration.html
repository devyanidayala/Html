<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <h1 align="center">Registration Form</h1>
    <table align="center" height="300" width="60%"  border="1" cellspacing="0" cellpadding="0">
        <td width="30%" bgcolor="pink"></td>
        </td>
        <td width="30%" bgcolor="occaecat">
            <h3 align="center">Register</h3>
            <p align="center">it's completely field</p>
            
            <p>
                <label for="name">NAME</label>
                <input type="name" name="name" placeholder="enter your name">
            </p>

            <p>
                <label for="username">USERNAME</label>
                <input type="username" name="username" placeholder="enter your username">
            </p>

            <p>
                <label for="email">EMAIL</label>
                <input type="email" name="email" placeholder="enter your email">
            </p>

            <p>
                <label for="password">PASSWORD</label>
                <input type="password" name="password" placeholder="enter your password">
            </p>

            <p>
                <label for="password">CONFIRM PASSWORD</label>
                <input type="password" name="cpassword" placeholder="enter your confirm password">
            </p>

            <p>
                <label for="submit">SUBMIT</label>
                <input type="submit" name="submit">
            </p>

            
            
        </td>
    </table>
