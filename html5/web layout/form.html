<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <form align="center" autocomplete="on" method="post">

        <h1 align="center">General Form</h1>

        <!-- text -->
        <p> 
            <label for="name">Name :-</label>
            <input type="name" name="name" placeholder="enter your name">
        </p>
        
        <!-- email -->
        <p> 
            <label for="email">Email :-</label>
            <input type="email" name="email" placeholder="enter your email">
        </p>

        <!-- password -->
        <p> 
            <label for="name">Password :-</label>
            <input type="password" name="password" placeholder="enter your password">
        </p>

        <!-- number -->
        <p> 
            <label for="number">Number :-</label>
            <input type="number" name="number" placeholder="enter your phoneno" min="0" max="10">
        </p>

        <!-- tel -->
        <p> 
            <label for="age">Age :-</label>
            <input type="age" name="age">
        </p>

        <!-- url -->
        <p> 
            <label for="url">Url :-</label>
            <input type="url" name="url">
        </p>

        <!-- date -->
        <p> 
            <label for="date">Date :-</label>
            <input type="date" name="date">
        </p>

        <!-- datetime -->
        <p> 
            <label for="dataetime">Datetime :-</label>
            <input type="datetime-local" name="datetime">
        </p>

        <!-- month -->
        <p> 
            <label for="month">Month :-</label>
            <input type="month" name="month">
        </p>

        <!-- week -->
         <p> 
            <label for="week">Week :-</label>
            <input type="week" name="month">
        </p>

        <!-- time -->
         <p> 
            <label for="time">Time :-</label>
            <input type="time" name="time">
        </p>

        <!-- radio -->
        <p> 
            <label for="gender">Gender :-</label>
            <input type="radio" name="male">Male
            <input type="radio" name="female" checked>Female
        </p>

        <!-- checkbox -->
        <p> 
            <label for="gender">Hobby :-</label>
            <input type="checkbox" name="music">music
            <input type="checkbox" name="travelling" checked>travelling
        </p>

        <!-- range -->
        <p> 
            <label for="range">Range :-</label>
            <input type="range" name="range" min="0" max="30">
        </p>

        <!-- color -->
        <p> 
            <label for="color">Color :-</label>
            <input type="color" name="color">
        </p>

        <!-- file -->
        <p> 
            <label for="uploadfile">uploadfile :-</label>
            <input type="file" name="file" multiple>
        </p>

        <!-- hidden -->
        <p> 
            <label for="hidden">Hidden :-</label>
            <input type="hidden" name="hidden" value="1234">
        </p>

        <!-- search -->
        <p> 
            <label for="search">Search :-</label>
            <input type="search" name="search">
        </p>

        <!-- submit -->
        <p> 
            <label for="Submit">Submit :-</label>
            <input type="submit" name="submit">
        </p>

        <!-- reset -->
        <p> 
            <label for="reset">Reset :-</label>
            <input type="reset" name="reset">
        </p>
        

    </form>
</body>
</html>
